.wall::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 45% 40%, rgba(8,8,10,.55) 0%, rgba(8,8,10,.30) 60%, rgba(8,8,10,.15) 100%)}
.app{position:relative;z-index:1;padding:22px 16px 40px;max-width:1500px;margin:0 auto}
@media (min-width:1280px){ .app{padding:26px 10.5vw 48px 3.5vw;max-width:none} }
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* Quadros herdam os tokens do tema escolhido */
.panel,.filters,.mbox,.live,.notice,.ddmenu{
  --ink:var(--b-ink);--ink-2:var(--b-ink2);--ink-3:var(--b-ink3);
  --line:var(--b-line);--line-strong:var(--b-line2);
  color:var(--ink);color-scheme:var(--box-scheme)}

/* ---------- Cabeçalho ---------- */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.brand .kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-weight:700}
.brand h1{margin:2px 0 0;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.brand .sub{margin-top:6px;color:var(--ink-3);font-size:13px}
.brand .sub b{color:var(--ink-2);font-weight:600}
.conn{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--hb-bg);border:1px solid var(--hb-border);font-size:12.5px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--s-none);flex:none}
.live.on .dot{background:var(--s-ok);animation:pulse 2s infinite}
.live.warn .dot{background:var(--s-and)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.btn{border:1px solid var(--line-strong);background:rgba(255,255,255,.06);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;transition:background .15s,border-color .15s;display:inline-flex;align-items:center;gap:8px}
.top .btn:not(.primary){background:var(--hb-bg);border-color:var(--hb-border);color:var(--hb-ink)}
.top .btn:not(.primary):hover{background:var(--hb-hover)}
.mbox .btn:not(.primary){background:var(--b-soft);border-color:var(--b-line);color:var(--b-ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#c50511}
.top .btn.admin-on{border-color:var(--s-ok);color:var(--good-ink)}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.dditem:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* Menus suspensos (tema / idioma) */
.dd{position:relative}
.ddbtn .car{font-size:10px;opacity:.6}
.ddmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:190px;background:var(--box-solid);border:1px solid var(--b-line2);border-radius:12px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.ddmenu .ddh{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:6px 10px 4px}
.dditem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink);text-align:left}
.dditem:hover{background:var(--b-soft)}
.dditem .ck{margin-left:auto;color:var(--red);font-weight:700;visibility:hidden}
.dditem[aria-checked="true"] .ck{visibility:visible}
.dditem[aria-checked="true"]{font-weight:600}
/* seleção múltipla nos quadros Tipo / Modelo */
.msel .ddbtn{padding:6px 12px;font-size:12.5px;background:var(--b-soft);border-color:var(--b-line);color:var(--b-ink)}
.msel .ddbtn[data-on="1"]{border-color:var(--red);color:var(--chip-ink)}
.msel .ddmenu{width:280px;max-width:calc(100vw - 32px)}
.msel .mlist{max-height:300px;overflow:auto;margin-top:6px}
.msel .mrow{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.msel .mrow:hover{background:var(--b-soft)}
.msel .mrow input{accent-color:var(--red);width:15px;height:15px;margin:0;flex:none}
.msel .mrow .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msel .mrow .q{font-size:11.5px;color:var(--ink-3)}
.msel .mrow.zero{opacity:.5}
.msel .mfoot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.msel .mfoot .linkbtn{font-size:12.5px}
.msel .search{padding:6px 10px;font-size:13px}
.hb.mono.extra .n{font-style:italic}
.pwrow{display:flex;flex-direction:column;gap:8px}
.flag{width:21px;height:14px;border-radius:2px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.18);display:block}
.ico{width:16px;height:16px;flex:none}

/* ---------- Filtros ---------- */
.filters{background:var(--box-bg);border:1px solid var(--box-border);box-shadow:0 10px 30px rgba(0,0,0,.35);border-radius:var(--radius);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:16px}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flabel{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-right:2px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line-strong);background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:7px;align-items:center;transition:all .15s}
.seg button:hover{border-color:var(--b-hover-border);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.seg button .c{font-size:11.5px;opacity:.75;font-weight:600}
.seg.small button{padding:4px 10px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
/* Filtros em linhas: Grupo, Time e Documento um embaixo do outro, cada linha com fundo de destaque */
.filters{flex-direction:column;align-items:stretch;gap:8px}
.filters .fgroup{flex-wrap:nowrap;align-items:center;gap:12px;background:var(--b-soft);border:1px solid var(--b-line);border-radius:10px;padding:8px 12px}
.filters .flabel{flex:none;width:100px;margin-right:0}
.filters .seg{flex:1;min-width:0}
.filters .chips{margin-left:0;justify-content:flex-end}
.filters .chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(227,6,19,.08);border:1px solid rgba(227,6,19,.45);color:var(--chip-ink);border-radius:999px;padding:4px 6px 4px 11px;font-size:12.5px;cursor:pointer}
.chip span.x{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(227,6,19,.14);font-size:12px}
.linkbtn{background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:12.5px;text-decoration:underline;padding:4px}
.linkbtn:hover{color:var(--ink)}

/* ---------- Painéis ---------- */
.panel{background:var(--box-bg);border:1px solid var(--box-border);border-radius:var(--radius);padding:16px 18px;min-width:0;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.panel h2{margin:0 0 2px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.panel .hint{color:var(--ink-3);font-size:12px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g-status{grid-template-columns:minmax(300px,1.05fr) 2fr}
.g-groups{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:16px}
.g-charts{grid-template-columns:1.2fr 1fr;margin-top:16px}
.g-charts2{grid-template-columns:1fr 1fr;margin-top:16px}
@media (max-width:1000px){.g-status,.g-charts,.g-charts2{grid-template-columns:1fr}}

/* Status geral */
.overall{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.gauge{position:relative;width:168px;height:168px;flex:none}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .trk{stroke:var(--b-soft)}
.gauge .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gauge .big{font-size:30px;font-weight:700;line-height:1}
.gauge .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.health{flex:1;min-width:170px}
.health .badge{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:999px;font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.badge.good{background:var(--good-bg);color:var(--good-ink)}
.badge.mid{background:var(--mid-bg);color:var(--mid-ink)}
.badge.bad{background:var(--bad-bg);color:var(--bad-ink)}
.health p{margin:10px 0 0;color:var(--ink-2);font-size:13.5px}
.health p b{color:var(--ink)}
.health p b.lt{color:var(--late)}
.stackbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--b-soft);margin-top:18px;gap:2px}
.stackbar div{height:100%;min-width:3px;cursor:pointer;transition:filter .15s}
.stackbar div:hover{filter:brightness(.9)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--kpi-bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.kpi:hover{border-color:var(--line-strong);background:var(--kpi-hover)}
.kpi[aria-pressed="true"]{border-color:var(--kpi-sel-border);background:var(--kpi-sel-bg);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k,var(--ink-3))}
.kpi .t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.kpi .v{font-size:30px;font-weight:700;line-height:1.15;margin-top:4px}
.kpi .s{font-size:12px;color:var(--ink-3)}

/* Cards por grupo */
.gcard{cursor:pointer;text-align:left;transition:border-color .15s;width:100%}
.gcard:hover{border-color:var(--line-strong)}
.gcard[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red),0 10px 30px rgba(0,0,0,.35)}
.gcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gcard .name{font-size:16px;font-weight:700}
.gcard .pct{font-size:26px;font-weight:700}
.prog{height:8px;border-radius:999px;background:var(--b-soft);overflow:hidden;margin:10px 0 10px}
.prog > div{height:100%;background:linear-gradient(90deg,#b0050f,var(--red));border-radius:999px}
.gcard .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2)}
.gcard .meta b{color:var(--ink)}
.gcard .meta .late b{color:var(--late)}

/* Barras horizontais */
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(110px,170px) 1fr 42px;gap:10px;align-items:center;cursor:pointer;border-radius:6px;padding:2px 4px;margin:0 -4px}
.hb:hover{background:var(--b-soft2)}
.hb.sel{background:rgba(227,6,19,.1)}
.hb .n{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .track{display:flex;height:16px;gap:2px}
.hb .track div{height:100%;border-radius:3px;min-width:2px}
.hb .v{font-size:12.5px;text-align:right;color:var(--ink-2)}
.hb .v small{color:var(--ink-3);font-size:inherit}
.hb.mono .track div{background:var(--mono)}
.hb.mono.sel .track div{background:var(--red)}

/* Colunas por período */
.g-charts > .panel{display:flex;flex-direction:column}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px 16px;flex-wrap:wrap;margin-bottom:4px}
.cols{display:flex;align-items:flex-end;gap:6px;flex:1;min-height:240px;padding-top:22px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .bar{width:100%;max-width:38px;background:var(--s-ok);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.col .bar.cur{background:repeating-linear-gradient(45deg,var(--s-ok) 0 6px,var(--s-ok-2) 6px 12px)}
.col .bar span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--ink-2)}
.col .m{font-size:11px;color:var(--ink-3);margin-top:6px;white-space:nowrap}

/* Redatores */
.redpick{max-height:132px;overflow:auto;padding:2px 2px 4px;margin-top:4px}
.redout{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.redempty{display:grid;place-items:center;text-align:center;color:var(--ink-3);font-size:13px;min-height:120px;border:1px dashed var(--line-strong);border-radius:10px;padding:16px}
.redsum{font-size:12px;color:var(--ink-3);margin-top:2px}
.empty{padding:30px;text-align:center;color:var(--ink-3)}

/* Tooltip */
#tip{position:fixed;z-index:80;pointer-events:none;background:#0f0f12;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:8px 10px;font-size:12.5px;color:#f4f4f5;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:280px;opacity:0;transition:opacity .1s;white-space:pre-line}

/* Aviso, arrastar, modal */
.notice{background:var(--notice-bg);border:1px solid var(--notice-border);color:var(--notice-ink);box-shadow:0 10px 30px rgba(0,0,0,.3);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.drop{position:fixed;inset:0;z-index:60;background:rgba(10,10,12,.82);display:grid;place-items:center;font-size:20px;font-weight:700;border:3px dashed var(--red)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(5,5,7,.72);display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px)}
.mbox{background:var(--box-solid);border:1px solid var(--b-line2);border-radius:16px;padding:22px;width:min(380px,100%);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox h3{margin:0 0 6px;font-size:17px}
.mbox p{margin:0 0 14px;color:var(--ink-3);font-size:13px}
.search{background:var(--input-bg);border:1px solid var(--line-strong);border-radius:10px;padding:8px 12px;color:var(--ink);font:inherit;width:100%}
.search::placeholder{color:var(--ink-3)}
.merr{color:var(--late);font-size:12.5px;min-height:18px;margin-top:6px}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.foot{margin-top:18px;color:#a1a1aa;font-size:12px}

/* ---------- Versão simplificada (celular) ---------- */
.mv,.mfull{display:none}
@media (max-width:760px){
  html:not(.full) .app{display:none}
  html:not(.full) .mv{display:block}
  html.full .mfull{display:inline-flex}
}
.mv{position:relative;z-index:1;padding:18px 14px 32px;max-width:560px;margin:0 auto}
.mv .mtop{margin-bottom:14px}
.mv .mtop h1{margin:2px 0 0;font-size:23px;line-height:1.15;font-weight:700}
.mv .mtop .sub{margin-top:5px;color:var(--ink-3);font-size:12px}
.mv .mtop .sub b{color:var(--ink-2);font-weight:600}
.mv .panel{padding:14px;margin-bottom:12px}
.mv .panel h2{margin-bottom:10px}

.mv .seg::-webkit-scrollbar{display:none}
.mv .seg button{flex:none;padding:8px 14px}
.mstat{display:flex;gap:14px;align-items:center}
.mv .gauge{width:116px;height:116px}
.mv .gauge .big{font-size:22px}
.mv .gauge .lbl{font-size:10px;margin-top:4px}
.mv .health{min-width:0}
.mv .health p{font-size:13px;margin-top:8px}
.mv .stackbar{margin-top:12px}
.mkpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mkpis .kpi{cursor:default;background:var(--box-bg);border:1px solid var(--box-border);box-shadow:0 10px 30px rgba(0,0,0,.3);
  --ink:var(--b-ink);--ink-3:var(--b-ink3);color:var(--ink)}
.mkpis .kpi.tap{cursor:pointer}
.mkpis .kpi .v{font-size:26px}
.mlate{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

.mlate .a{font-size:13.5px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mlate .d{font-size:12px;color:var(--ink-3);margin-top:2px}
.mlate .d b{color:var(--late)}

.mmore{font-size:12.5px;color:var(--ink-3);margin-top:10px}
.mbtn{width:100%;justify-content:center;padding:12px;font-size:14px;margin-top:4px}
.mfoot{margin-top:12px;color:#a1a1aa;font-size:11.5px;text-align:center}
.mctl{display:flex;gap:8px;align-items:center;margin-top:12px}

.mlang{display:inline-flex;background:var(--hb-bg);border:1px solid var(--hb-border);border-radius:10px;padding:3px;gap:2px}

.mlang button[aria-pressed="true"]{background:var(--red);color:#fff}
.mv .flabel{display:block;margin:0 0 6px}
.mv .mfg + .mfg{margin-top:12px}
.mv .phead{margin-bottom:8px}
.mv .phead .seg{flex:1;justify-content:flex-end}

.mv .col .m{font-size:9px;letter-spacing:-.02em;margin-top:5px}
.mv .col .bar span{font-size:10.5px}
.mfull{position:fixed;right:14px;bottom:14px;z-index:50;background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.45);padding:10px 16px}
.brandrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}

/* ================= Leitor de .xlsx/.xlsm (sem bibliotecas externas) ================= */
async function openZip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('.xlsx/.xlsm ?');
  const n = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const entries = {};
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nlen));
    entries[name.toLowerCase()] = { method, csize, off };
    p += 46 + nlen + elen + clen;
  }
  return {
    async text(name){
      const e = entries[name.replace(/^\//,'').toLowerCase()];
      if (!e) return null;
      const lnl = dv.getUint16(e.off + 26, true), lel = dv.getUint16(e.off + 28, true);
      const start = e.off + 30 + lnl + lel;
      const data = u8.subarray(start, start + e.csize);
      if (e.method === 0) return td.decode(data);
      const s = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return td.decode(await new Response(s).arrayBuffer());
    }
  };
}
const xml = t => new DOMParser().parseFromString(t, 'application/xml');
function colIndex(ref){ let n = 0; for (const ch of ref) { const c = ch.charCodeAt(0); if (c < 65 || c > 90) break; n = n * 26 + (c - 64); } return n - 1; }

async function readSheetRows(buf, sheetName){
  const zip = await openZip(buf);
  const wb = xml(await zip.text('xl/workbook.xml'));
  const rels = xml(await zip.text('xl/_rels/workbook.xml.rels'));
  const sheets = [...wb.getElementsByTagName('sheet')];
  const target = sheets.find(s => norm(s.getAttribute('name')) === norm(sheetName));
  if (!target) throw new Error(`"${sheetName}" ? → ${sheets.map(s => s.getAttribute('name')).join(', ')}`);
  const rid = target.getAttribute('r:id') || target.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
  const rel = [...rels.getElementsByTagName('Relationship')].find(r => r.getAttribute('Id') === rid);
  let path = rel.getAttribute('Target');
  path = path.startsWith('/') ? path.slice(1) : 'xl/' + path.replace(/^\.\//,'');
  const ssText = await zip.text('xl/sharedStrings.xml');
  const ss = ssText ? [...xml(ssText).getElementsByTagName('si')].map(si =>
    [...si.getElementsByTagName('t')].filter(t => t.parentNode.nodeName !== 'rPh').map(t => t.textContent).join('')) : [];
  const sh = xml(await zip.text(path));
  const out = [];
  for (const r of sh.getElementsByTagName('row')) {
    const arr = []; let seq = 0;
    for (const c of r.getElementsByTagName('c')) {
      const ref = c.getAttribute('r'); const ci = ref ? colIndex(ref) : seq; seq = ci + 1;
      if (ci > 30) continue;
      const t = c.getAttribute('t'); let v;
      if (t === 'inlineStr') v = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
      else {
        const ve = c.getElementsByTagName('v')[0]; if (!ve) continue;
        v = ve.textContent;
        if (t === 's') v = ss[+v];
        else if (t === 'b') v = v === '1';
        else if (t !== 'str' && t !== 'e') { const num = Number(v); v = isNaN(num) ? v : num; }
      }
      arr[ci] = v;
    }
    out.push(arr);
  }
  return out;
}

/* ================= Normalização dos registros ================= */
const clean = v => v == null ? '' : String(v).replace(/ /g,' ').replace(/\s+/g,' ').trim();
function toDate(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') {
    if (v < 30000 || v > 80000) return null;
    const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5);
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  const m = clean(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return new Date(y, +m[2] - 1, +m[1]); }
  return null;
}
function toEvo(v){
  if (v == null || v === '') return null;
  let n = typeof v === 'number' ? v : parseFloat(clean(v).replace('%','').replace(',','.'));
  if (isNaN(n)) return null;
  if (typeof v !== 'number' && /%/.test(String(v))) n /= 100;
  else if (n > 1.0001 && n <= 100) n /= 100;
  return Math.max(0, Math.min(1, n));
}
function rowsToRecords(rows){
  /* linha de cabeçalho = a que tiver mais nomes conhecidos (tolera colunas renomeadas) */
  let hi = -1, best = 0;
  for (let i = 0; i < Math.min(rows.length, 40); i++) {
    const h = (rows[i] || []).map(norm);
    const score = Object.values(COLS).filter(names => h.some(x => names.includes(x))).length;
    if (score > best) { best = score; hi = i; }
  }
  if (hi < 0 || best < 4) throw new Error('TIME, TIPO, …, STATUS, GRUPO ?');
  const head = (rows[hi] || []).map(norm), map = {};
  for (const [k, names] of Object.entries(COLS)) map[k] = head.findIndex(x => names.includes(x));
  /* coluna com nome desconhecido → usa a posição original, se ninguém mais a ocupa */
  const base = map.time >= 0 ? map.time : 0, taken = new Set(Object.values(map).filter(i => i >= 0));
  for (const k of Object.keys(COLS)) {
    const pos = base + COL_POS[k];
    if (map[k] < 0 && !taken.has(pos) && head[pos]) { map[k] = pos; taken.add(pos); }
  }
  const recs = [];
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i] || []; const g = k => map[k] >= 0 ? r[map[k]] : null;
    const atividade = clean(g('atividade')), status = norm(g('status')), grupo = norm(g('grupo')), redator = clean(g('redator'));
    if (!atividade && !status && !grupo && !redator) continue;
    if (norm(atividade) === 'ATIVIDADE') continue;
    recs.push({
      time: clean(g('time')).toUpperCase() || 'SEM TIME',
      tipo: clean(g('tipo')) || '—',
      manual: clean(g('manual')),
      atividade,
      modelo: clean(g('modelo')).toUpperCase() || '—',
      doc: clean(g('documento')).toUpperCase() || 'NÃO INFORMADO',
      redator,
      redatores: redator.split(/\s*\/\s*|\s+-\s+|\s*,\s*/).map(s => s.toUpperCase().trim()).filter(Boolean),
      start: toDate(g('start')),
      end: toDate(g('end')),
      evo: toEvo(g('evo')),
      status: status ? (STATUS_ORDER.find(s => norm(s) === status) || status) : 'SEM STATUS',
      grupo: grupo || 'SEM GRUPO'
    });
  }
  return recs;
}

function renderMono(el, rs, key, top, fkey){

function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function renderPeriods(rs, per = '#fPer', ch = '#chMes', hint = '#mesHint'){
  segButtons($(per), [{v:'week',label:T('week'),n:''},{v:'month',label:T('month'),n:''},{v:'year',label:T('year'),n:''}], PER, v => { PER = v; render(); });
  const done = rs.filter(r => isDone(r) && r.end);
  let buckets = [], keyOf, labelOf, tipOf;
  if (PER === 'week') {
    const cur = mondayOf(TODAY);
    for (let i = 11; i >= 0; i--) { const d = new Date(cur); d.setDate(d.getDate() - 7 * i); buckets.push(d); }
    keyOf = d => +mondayOf(d); labelOf = d => 'CW' + isoWeek(d);
    tipOf = d => { const e = new Date(d); e.setDate(e.getDate() + 6); return `CW${isoWeek(d)} (${T('range')(df.format(d), df.format(e))})`; };
    $(hint).textContent = T('hintWeek');
  } else if (PER === 'year') {
    const y0 = Math.min(TODAY.getFullYear(), ...done.map(r => r.end.getFullYear()));
    for (let y = y0; y <= TODAY.getFullYear(); y++) buckets.push(new Date(y, 0, 1));
    keyOf = d => d.getFullYear(); labelOf = d => String(d.getFullYear()); tipOf = labelOf;
    $(hint).textContent = T('hintYear');
  } else {
    const now = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    for (let i = 11; i >= 0; i--) buckets.push(new Date(now.getFullYear(), now.getMonth() - i, 1));
    keyOf = d => d.getFullYear() * 12 + d.getMonth();
    labelOf = d => monS.format(d).replace('.', '') + '/' + String(d.getFullYear()).slice(2);
    tipOf = d => cap(monL.format(d));
    $(hint).textContent = T('hintMonth');
  }
  if (!done.length) { $(ch).innerHTML = `<div class="redempty" style="flex:1;align-self:stretch">${esc(T('noDeliv'))}</div>`; return; }
  const c = countBy(done, r => keyOf(r.end)), max = Math.max(1, ...buckets.map(b => c.get(keyOf(b)) || 0)), last = buckets.length - 1;
  $(ch).innerHTML = buckets.map((b, i) => { const v = c.get(keyOf(b)) || 0;
    return `<div class="col" data-tip="${esc(tipOf(b))}: ${esc(T('delivTip')(v))}${i === last ? esc(T('partial')) : ''}"><div class="bar ${i === last ? 'cur' : ''}" style="height:${v / max * 100}%">${v ? `<span class="num">${v}</span>` : ''}</div><div class="m">${esc(labelOf(b))}</div></div>`; }).join('');
}

/* ================= Conexão com a planilha (atualização automática) ================= */
const FS = 'showOpenFilePicker' in window;
let handle = null, lastSig = '', timer = null, busy = false;

/* cada arquivo HTML tem sua própria memória (vínculo com a planilha + últimos dados),
   assim cópias e backups com outro nome não são atualizados junto com o painel principal */
const IDB_NAME = 'painel-lt-corrente|' + (decodeURIComponent(location.pathname.split('/').pop() || '') || 'painel').toLowerCase();
const idb = (() => {
  let p; const open = () => p || (p = new Promise((res, rej) => { const r = indexedDB.open(IDB_NAME, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  return {
    async get(k){ try { const db = await open(); return await new Promise(res => { const t = db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); }); } catch { return undefined; } },
    async set(k, v){ try { const db = await open(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch {} }
  };
})();

function setLive(state, key, arg){
  LIVE = { state, key, arg };
  $('#live').className = 'live ' + (state || '');
  const v = T(key); $('#liveTxt').textContent = typeof v === 'function' ? v(arg) : v;
}
const nowTime = () => new Date().toLocaleTimeString(LANGS[LANG].locale);

async function ingest(buf, name, when){
  const rows = await readSheetRows(buf, SHEET_NAME);
  DATA = rowsToRecords(rows); LAST_ROWS = rows; SOURCE = { name, when: new Date(when) };
  render();
  idb.set('cache', { rows, name, when });
}
async function checkFile(force){
  if (!handle || busy) return; busy = true;
  try {
    const f = await handle.getFile(), sig = f.lastModified + ':' + f.size;
    if (force || sig !== lastSig) { await ingest(await f.arrayBuffer(), f.name, f.lastModified); lastSig = sig; }
    setLive('on', 'lvLive', nowTime());
  } catch (err) {
    if (err && err.name === 'NotAllowedError') { setLive('warn', 'lvPerm'); stopPolling(); showReconnect(); }
    else setLive('warn', 'lvBusy');
    console.warn(err);
  } finally { busy = false; }
}
function startPolling(){ stopPolling(); timer = setInterval(() => checkFile(false), POLL_MS); CONN_KEY = 'change'; applyAdmin(); }
function stopPolling(){ if (timer) clearInterval(timer); timer = null; }
function showReconnect(){ CONN_KEY = 'reconnect'; applyAdmin(); if (!ADMIN) setLive('warn', 'lvPausedAdm'); }

/* ================= Acesso do administrador ================= */
const ADMIN_HASH_FILE = '099190bab6de8ca614086ed5e4fd97e7cba69dab2dedfe5987109962580ba16b';
/* senha trocada neste navegador tem prioridade sobre a gravada no arquivo */
let ADMIN_HASH = (() => { try { return localStorage.getItem('lt-adm-hash') || ADMIN_HASH_FILE; } catch { return ADMIN_HASH_FILE; } })();
let ADMIN = (() => { try { return sessionStorage.getItem('lt-adm') === ADMIN_HASH; } catch { return false; } })();
let pendingAdmin = null;
async function sha256hex(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function applyAdmin(){
  const c = $('#btnConnect'), a = $('#btnAdmin'), r = $('#btnRefresh');
  c.textContent = CONN_KEY === 'reconnect' ? T('reconnect')(handle ? handle.name : '') : T(CONN_KEY);
  c.classList.toggle('hidden', !ADMIN);
  a.textContent = ADMIN ? T('adminOut') : '🔒 ' + T('admin');
  a.title = T('adminTitle');
  a.classList.toggle('admin-on', ADMIN);
  const pw = $('#btnPw'); pw.textContent = T('pwBtn'); pw.classList.toggle('hidden', !ADMIN);
  const sv = $('#btnSave');
  if (!SAVE_FLASH) sv.textContent = T('save');
  sv.title = T('saveTitle');
  sv.classList.toggle('hidden', !ADMIN || BACKUP);
  const bk = $('#btnBackup');
  if (!SAVE_FLASH) bk.textContent = T('saveBk');
  bk.title = T('saveBkTitle');
  bk.classList.toggle('hidden', !ADMIN || BACKUP);
  if (BACKUP) { c.classList.add('hidden'); r.classList.add('hidden'); }
  r.textContent = T(REFRESH_KEY);
  r.classList.toggle('hidden', !timer);
}
function requireAdmin(fn){
  if (ADMIN) return fn();
  pendingAdmin = fn; $('#admErr').textContent = ''; $('#admPw').value = '';
  $('#admModal').classList.remove('hidden'); setTimeout(() => $('#admPw').focus(), 30);
}
function closeAdmin(){ $('#admModal').classList.add('hidden'); pendingAdmin = null; }
$('#admForm').addEventListener('submit', async e => {
  e.preventDefault();
  const h = await sha256hex('lt-corrente|' + $('#admPw').value);
  if (h !== ADMIN_HASH) { $('#admErr').textContent = T('wrong'); $('#admPw').select(); return; }
  ADMIN = true; try { sessionStorage.setItem('lt-adm', h); } catch {}
  const fn = pendingAdmin; closeAdmin(); applyAdmin(); if (fn) fn();
});
$('#admCancel').addEventListener('click', closeAdmin);
$('#admModal').addEventListener('click', e => { if (e.target.id === 'admModal') closeAdmin(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#admModal').classList.contains('hidden')) closeAdmin(); });
$('#btnAdmin').addEventListener('click', () => {
  if (ADMIN) { ADMIN = false; try { sessionStorage.removeItem('lt-adm'); } catch {} applyAdmin(); }
  else requireAdmin(() => {});
});

/* ================= Trocar senha ================= */
function openPw(){
  ['#pwOld','#pwNew','#pwNew2'].forEach(s => $(s).value = ''); $('#pwErr').textContent = '';
  $('#pwModal').classList.remove('hidden'); setTimeout(() => $('#pwOld').focus(), 30);
}
const closePw = () => $('#pwModal').classList.add('hidden');
$('#btnPw').addEventListener('click', () => requireAdmin(openPw));
$('#pwCancel').addEventListener('click', closePw);
$('#pwModal').addEventListener('click', e => { if (e.target.id === 'pwModal') closePw(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#pwModal').classList.contains('hidden')) closePw(); });
$('#pwForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = m => { $('#pwErr').textContent = m; };
  if (await sha256hex('lt-corrente|' + $('#pwOld').value) !== ADMIN_HASH) { err(T('wrong')); $('#pwOld').select(); return; }
  const nw = $('#pwNew').value;
  if (nw.length < 4) { err(T('pwShort')); $('#pwNew').focus(); return; }
  if (nw !== $('#pwNew2').value) { err(T('pwDiff')); $('#pwNew2').select(); return; }
  ADMIN_HASH = await sha256hex('lt-corrente|' + nw);
  try { localStorage.setItem('lt-adm-hash', ADMIN_HASH); sessionStorage.setItem('lt-adm', ADMIN_HASH); } catch {}
  closePw();
  $('#btnPw').textContent = T('pwOk'); setTimeout(applyAdmin, 2500);
});

/* ================= Salvar painel atualizado (cópia HTML com os dados atuais) ================= */
let SHOW_ADM = location.hash === '#admin', SAVE_FLASH = false;
addEventListener('keydown', e => {
  if (SHARED && e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) { e.preventDefault(); SHOW_ADM = true; applyAdmin(); requireAdmin(() => {}); }
});
function buildUpdatedHtml(backup = false){
  const snap = { file: SOURCE.name, when: new Date(SOURCE.when).toISOString(), rows: LAST_ROWS };
  const json = JSON.stringify(snap).replace(/</g, '\\u003c');
  return '<!doctype html>\n' + PAGE_SRC
    .replace(/^<html[^>]*>/, '<html lang="pt-BR" data-theme="light">')
    .replace(new RegExp('const ' + 'SNAPSHOT = [^\\n]*'), () => 'const SNAPSHOT = ' + json + ';')
    .replace('const ' + 'SHARED = false;', 'const SHARED = true;')
    .replace(new RegExp("const " + "ADMIN_HASH_FILE = '[0-9a-f]+';"), "const ADMIN_HASH_FILE = '" + ADMIN_HASH + "';")
    .replace('const ' + 'BACKUP = false;', 'const BACKUP = ' + (backup ? 'true' : 'false') + ';');
}
async function savePanel(backup = false){
  if (backup !== true) backup = false;
  if (!ADMIN) return requireAdmin(() => savePanel(backup));
  const blob = new Blob([buildUpdatedHtml(backup)], { type: 'text/html;charset=utf-8' });
  const pad = n => String(n).padStart(2, '0'), d = new Date(SOURCE.when);
  const name = backup ? `Painel_LT_Corrente_backup_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.html` : 'Painel_LT_Corrente.html';
  try {
    if ('showSaveFilePicker' in window) {
      const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close();
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
    SAVE_FLASH = true; $(backup ? '#btnBackup' : '#btnSave').textContent = T('saved');
    setTimeout(() => { SAVE_FLASH = false; applyAdmin(); }, 2500);
  } catch (err) { if (err.name !== 'AbortError') alert(T('saveErr') + '\n' + err.message); }
}
$('#btnSave').addEventListener('click', () => savePanel(false));
$('#btnBackup').addEventListener('click', () => savePanel(true));

async function connect(){
  if (BACKUP) return;
  if (!ADMIN) return requireAdmin(connect);
  if (!FS) { $('#fileIn').click(); return; }
  try {
    if (handle && (await handle.queryPermission({ mode: 'read' })) !== 'granted') {
      if ((await handle.requestPermission({ mode: 'read' })) === 'granted') { lastSig = ''; await checkFile(true); startPolling(); return; }
    }
    const [h] = await window.showOpenFilePicker({ multiple: false, types: [{ description: 'Excel', accept: { 'application/vnd.ms-excel.sheet.macroEnabled.12': ['.xlsm'], 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }] });
    handle = h; lastSig = '';
    await idb.set('handle', h);
    await checkFile(true); startPolling();
  } catch (err) { if (err.name !== 'AbortError') alert(T('readErr') + '\n' + err.message); }
}
$('#btnConnect').addEventListener('click', connect);
$('#btnRefresh').addEventListener('click', () => { if (handle && timer) checkFile(true); else requireAdmin(() => $('#fileIn').click()); });
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { await ingest(await f.arrayBuffer(), f.name, f.lastModified); setLive('warn', 'lvManual'); REFRESH_KEY = 'loadAgain'; applyAdmin(); }
  catch (err) { alert(T('readErr') + '\n' + err.message); }
  e.target.value = '';
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && timer) checkFile(false); });

/* Arrastar e soltar o arquivo (somente admin) */
let dragN = 0;
addEventListener('dragenter', e => { if (ADMIN && !BACKUP && [...e.dataTransfer.types].includes('Files')) { dragN++; $('#drop').classList.remove('hidden'); } });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('#drop').classList.add('hidden'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => {
  e.preventDefault(); dragN = 0; $('#drop').classList.add('hidden');
  if (!ADMIN || BACKUP) return;
  const it = e.dataTransfer.items && e.dataTransfer.items[0];
  try {
    if (it && it.getAsFileSystemHandle) { const h = await it.getAsFileSystemHandle(); if (h && h.kind === 'file') { handle = h; lastSig = ''; await idb.set('handle', h); await checkFile(true); startPolling(); return; } }
    const f = e.dataTransfer.files[0]; if (f) { await ingest(await f.arrayBuffer(), f.name, f.lastModified); setLive('warn', 'lvManual'); }
  } catch (err) { alert(T('readErr') + '\n' + err.message); }
});

/* ================= Inicialização ================= */
(async function init(){
  applyI18n();
  DATA = rowsToRecords(SNAPSHOT.rows);
  render();
  if (BACKUP) { setLive('', 'lvBackup', new Date(SNAPSHOT.when).toLocaleString(LANGS[LANG].locale)); applyAdmin(); return; }
  if (!FS) setLive('', 'lvNoFS');
  const cache = await idb.get('cache');
  if (cache && cache.when > +new Date(SNAPSHOT.when)) {
    try { DATA = rowsToRecords(cache.rows); LAST_ROWS = cache.rows; SOURCE = { name: cache.name, when: new Date(cache.when) }; render(); setLive('', 'lvCache'); } catch {}
  }
  if (FS) {
    const h = await idb.get('handle');
    if (h) {
      handle = h;
      try {
        if ((await h.queryPermission({ mode: 'read' })) === 'granted') { await checkFile(true); startPolling(); }
        else { setLive('warn', 'lvPaused'); showReconnect(); }
      } catch { showReconnect(); }
    }
  }
})();
</script></body></html>
